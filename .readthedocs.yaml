# .readthedocs.yaml
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: true

# The package is read from src/ and its heavy imports are mocked in conf.py,
# so only the documentation toolchain needs to be installed here.
python:
  install:
    - requirements: docs/requirements.txt

formats:
  - pdf
